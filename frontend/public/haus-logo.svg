<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="glassRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4878A"/>
      <stop offset="100%" stop-color="#EAB8BC"/>
    </linearGradient>
    <linearGradient id="glassGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8935A"/>
      <stop offset="100%" stop-color="#E2C98A"/>
    </linearGradient>
    <linearGradient id="glassPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A0A5"/>
      <stop offset="100%" stop-color="#F0CECE"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="238" fill="url(#bgGrad)"/>

  <!-- ── STREAMERS ── -->
  <!-- Far left pink streamer -->
  <path d="M 178 122 C 162 140, 155 162, 168 180 C 181 198, 168 215, 158 235"
    stroke="#C4878A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 190 108 C 172 128, 178 150, 160 168"
    stroke="#EAB8BC" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Far right gold streamer -->
  <path d="M 322 118 C 338 138, 345 160, 332 178 C 319 196, 332 213, 342 233"
    stroke="#B8935A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 310 106 C 328 126, 322 148, 340 166"
    stroke="#E2C98A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Top center micro streamers -->
  <path d="M 250 118 C 238 108, 220 106, 210 115"
    stroke="#EAB8BC" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M 250 118 C 262 108, 280 106, 290 115"
    stroke="#E2C98A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- ── CONFETTI ── -->
  <!-- Dots -->
  <circle cx="213" cy="148" r="4"   fill="#C9A96E" opacity="0.9"/>
  <circle cx="289" cy="142" r="3.5" fill="#D4939A" opacity="0.9"/>
  <circle cx="238" cy="132" r="3"   fill="#E8D5A3" opacity="0.85"/>
  <circle cx="264" cy="130" r="3.5" fill="#C9A96E" opacity="0.9"/>
  <circle cx="227" cy="158" r="2.5" fill="white"   opacity="0.7"/>
  <circle cx="275" cy="155" r="3"   fill="#E8AFAF" opacity="0.8"/>
  <circle cx="250" cy="125" r="2.5" fill="#C9A96E" opacity="0.75"/>
  <circle cx="199" cy="163" r="3.5" fill="#D4939A" opacity="0.8"/>
  <circle cx="302" cy="158" r="3"   fill="#C9A96E" opacity="0.8"/>
  <circle cx="207" cy="138" r="2.5" fill="white"   opacity="0.65"/>
  <circle cx="293" cy="140" r="2.5" fill="#E8AFAF" opacity="0.7"/>
  <circle cx="253" cy="142" r="3"   fill="white"   opacity="0.8"/>
  <circle cx="242" cy="162" r="2"   fill="#C9A96E" opacity="0.65"/>
  <circle cx="184" cy="175" r="2.5" fill="#E8AFAF" opacity="0.6"/>
  <circle cx="316" cy="172" r="2.5" fill="#C9A96E" opacity="0.6"/>

  <!-- Small rotated confetti squares -->
  <rect x="222" y="138" width="6" height="6" rx="1" fill="#C4878A" opacity="0.75" transform="rotate(20 225 141)"/>
  <rect x="270" y="133" width="5" height="5" rx="1" fill="#C9A96E" opacity="0.75" transform="rotate(-25 272 135)"/>
  <rect x="244" y="150" width="5" height="5" rx="1" fill="white"   opacity="0.6"  transform="rotate(35 246 152)"/>
  <rect x="261" y="158" width="4" height="4" rx="1" fill="#D4939A" opacity="0.7"  transform="rotate(-15 263 160)"/>
  <rect x="202" y="150" width="5" height="5" rx="1" fill="#E8D5A3" opacity="0.65" transform="rotate(40 204 152)"/>
  <rect x="297" y="147" width="5" height="5" rx="1" fill="#EAB8BC" opacity="0.65" transform="rotate(-30 299 149)"/>

  <!-- ── SPARKLE at clink point ── -->
  <g transform="translate(250, 175)" opacity="0.9">
    <line x1="0" y1="-9" x2="0" y2="9"     stroke="white" stroke-width="1.8"/>
    <line x1="-9" y1="0" x2="9" y2="0"     stroke="white" stroke-width="1.8"/>
    <line x1="-6" y1="-6" x2="6" y2="6"    stroke="white" stroke-width="1.2"/>
    <line x1="6"  y1="-6" x2="-6" y2="6"   stroke="white" stroke-width="1.2"/>
  </g>
  <circle cx="250" cy="175" r="3" fill="white" opacity="0.85"/>

  <!-- ── CHAMPAGNE GLASSES ── -->

  <!-- Far-left glass — rose, tilted -30° -->
  <g transform="translate(210, 258) rotate(-28)">
    <path d="M -11 0 L -19 -62 L 19 -62 L 11 0 Z"  fill="#C4878A" opacity="0.22"/>
    <path d="M -11 0 L -19 -62 L 19 -62 L 11 0 Z"  fill="none" stroke="#D4939A" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-19" y1="-62" x2="19" y2="-62"       stroke="#EAB8BC" stroke-width="2.5"/>
    <rect x="-2.5" y="0" width="5" height="36" rx="1.5" fill="#D4939A"/>
    <rect x="-14"  y="36" width="28" height="6" rx="3"  fill="#D4939A"/>
  </g>

  <!-- Center-left glass — champagne/beige, tilt -10° -->
  <g transform="translate(238, 252) rotate(-10)">
    <path d="M -9 0 L -15 -68 L 15 -68 L 9 0 Z"    fill="#C9A96E" opacity="0.18"/>
    <path d="M -9 0 L -15 -68 L 15 -68 L 9 0 Z"    fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-15" y1="-68" x2="15" y2="-68"       stroke="#E8D5A3" stroke-width="2.5"/>
    <rect x="-2" y="0" width="4" height="33" rx="1.5" fill="#C9A96E"/>
    <rect x="-13" y="33" width="26" height="5" rx="3"  fill="#C9A96E"/>
  </g>

  <!-- Center-right glass — pink, tilt +10° -->
  <g transform="translate(262, 252) rotate(10)">
    <path d="M -9 0 L -15 -68 L 15 -68 L 9 0 Z"    fill="#EAB8BC" opacity="0.18"/>
    <path d="M -9 0 L -15 -68 L 15 -68 L 9 0 Z"    fill="none" stroke="#EAB8BC" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-15" y1="-68" x2="15" y2="-68"       stroke="#F0CECE" stroke-width="2.5"/>
    <rect x="-2" y="0" width="4" height="33" rx="1.5" fill="#EAB8BC"/>
    <rect x="-13" y="33" width="26" height="5" rx="3"  fill="#EAB8BC"/>
  </g>

  <!-- Far-right glass — gold, tilted +28° -->
  <g transform="translate(290, 258) rotate(28)">
    <path d="M -11 0 L -19 -62 L 19 -62 L 11 0 Z"  fill="#B8935A" opacity="0.22"/>
    <path d="M -11 0 L -19 -62 L 19 -62 L 11 0 Z"  fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-19" y1="-62" x2="19" y2="-62"       stroke="#E2C98A" stroke-width="2.5"/>
    <rect x="-2.5" y="0" width="5" height="36" rx="1.5" fill="#C9A96E"/>
    <rect x="-14"  y="36" width="28" height="6" rx="3"  fill="#C9A96E"/>
  </g>

  <!-- ── HAUS TEXT ── -->
  <text x="250" y="336"
    font-family="'Arial Black', 'Arial Bold', 'Helvetica Neue', Arial, sans-serif"
    font-size="122"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="8">HAUS</text>

  <!-- ── TAGLINE ── -->
  <text x="250" y="364"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    fill="rgba(255,255,255,0.6)"
    text-anchor="middle"
    font-style="italic"
    letter-spacing="0.4">Organización y producción de eventos sociales</text>
</svg>
